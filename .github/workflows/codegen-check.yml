name: codegen-check

# Proves that what is committed is exactly what build_runner produces.
# If a generated file (.g.dart) is stale or was hand-edited, this job fails.
on: [push, pull_request]

jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
      - run: flutter pub get
      - name: Regenerate codegen from source
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Fail if the generated code changed
        run: git diff --exit-code
